# SonarQube settings for the Flower Shop.
# The server address and token are NOT stored here.
# They come from the GitHub secrets SONAR_HOST_URL and SONAR_TOKEN.

sonar.projectKey=flower-shop
sonar.projectName=Flower Shop

# Where the application code and the tests are.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx
sonar.exclusions=frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/setupTests.js
sonar.coverage.exclusions=frontend/src/main.jsx,backend/src/server.js

# Test coverage reports created by "npm run test:coverage".
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
