server {
    # The frontend container listens on port 5173 (same port as the Vite dev server).
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend container.
    # "backend" is the service name from docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve the React app. Unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
